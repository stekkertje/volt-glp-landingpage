name: Codex review

on:
  pull_request:
    branches:
      - hostinger-node-server
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

concurrency:
  group: codex-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      vars.CODEX_AUTOMATION_ENABLED == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      final_message: ${{ steps.codex.outputs.final-message }}
    steps:
      - name: Check out the merge result
        uses: actions/checkout@v6
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0
          persist-credentials: false

      - name: Require the Codex API secret
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: test -n "$OPENAI_API_KEY"

      - name: Load the trusted review prompt from the base commit
        id: trusted-prompt
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          TRUSTED_REVIEW_PROMPT: ${{ runner.temp }}/codex-review.md
        run: |
          if git cat-file -e "$BASE_SHA:.github/codex/prompts/review.md"; then
            git show "$BASE_SHA:.github/codex/prompts/review.md" > "$TRUSTED_REVIEW_PROMPT"
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::De vertrouwde Codex-prompt staat nog niet op de basisbranch; alleen deze bootstrap-PR slaat de AI-review over."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare a trusted review worktree
        if: steps.trusted-prompt.outputs.available == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEW_WORKTREE: ${{ runner.temp }}/codex-review-worktree
          TRUSTED_REVIEW_PROMPT: ${{ runner.temp }}/codex-review.md
        run: |
          git worktree add --detach "$REVIEW_WORKTREE" HEAD

          find "$REVIEW_WORKTREE" \
            \( -name AGENTS.md -o -name AGENTS.override.md \) -delete

          for path in AGENTS.md AGENTS.override.md; do
            if git cat-file -e "$BASE_SHA:$path"; then
              git show "$BASE_SHA:$path" > "$REVIEW_WORKTREE/$path"
            fi
          done

          test -d "$REVIEW_WORKTREE/docs"
          test ! -L "$REVIEW_WORKTREE/docs"
          for path in docs/WEBSITE-OPERATIONS.md docs/REVIEW-CHECKLIST.md; do
            rm -f "$REVIEW_WORKTREE/$path"
            if git cat-file -e "$BASE_SHA:$path"; then
              git show "$BASE_SHA:$path" > "$REVIEW_WORKTREE/$path"
            fi
          done

          printf '\nReview het bereik met: git diff %s...%s --\n' \
            "$BASE_SHA" "$HEAD_SHA" >> "$TRUSTED_REVIEW_PROMPT"

      - name: Run read-only Codex review
        if: steps.trusted-prompt.outputs.available == 'true'
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: ${{ runner.temp }}/codex-review.md
          working-directory: ${{ runner.temp }}/codex-review-worktree
          sandbox: read-only
          safety-strategy: drop-sudo
          codex-args: '["--ephemeral", "--ignore-rules"]'
          allow-users: stekkertje

  post-feedback:
    needs: review
    if: needs.review.outputs.final_message != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Post review result
        uses: actions/github-script@v7
        env:
          CODEX_FINAL_MESSAGE: ${{ needs.review.outputs.final_message }}
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: process.env.CODEX_FINAL_MESSAGE,
            });
