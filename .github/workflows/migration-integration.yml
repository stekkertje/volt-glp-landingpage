name: Migration integration

on:
  pull_request:
  push:
    branches:
      - main
      - cursor/shop-backend

permissions:
  contents: read

concurrency:
  group: migration-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migration-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: volt
          POSTGRES_PASSWORD: volt-test-password
          POSTGRES_DB: volt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U volt -d volt_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_MIGRATION_DATABASE_URL: postgresql://volt:volt-test-password@127.0.0.1:5432/volt_test
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        env:
          NODE_ENV: production
          NPM_CONFIG_INCLUDE: dev
        run: npm ci --include=dev

      - name: Install Chromium for browser regression tests
        run: npx playwright install --with-deps chromium

      - name: Run the isolated application test suite
        env:
          TEST_MIGRATION_DATABASE_URL: ""
        run: npm test

      - name: Run migration configuration and PostgreSQL lock tests
        run: >-
          node --test
          scripts/migration-database.test.mjs
          scripts/migration-lock.test.mjs
          scripts/order-migration-upgrade.test.mjs

      - name: Run the production migrator twice on PostgreSQL
        run: node --test scripts/migration-postgres-integration.test.mjs

      - name: Test Hostinger deployment adapter and noindex headers
        run: >-
          node --test
          scripts/hostinger-deploy.test.mjs
          scripts/security-headers.test.mjs

      - name: Build the Hostinger Node.js output on PostgreSQL
        env:
          DATABASE_URL: ${{ env.TEST_MIGRATION_DATABASE_URL }}
          MIGRATION_DATABASE_URL: ${{ env.TEST_MIGRATION_DATABASE_URL }}
          VITE_AUTH_ENABLED: "false"
          VITE_NO_INDEX: "1"
          NO_INDEX: "1"
          VITE_PUBLIC_HOSTNAME: afslank-injecties.nl
          REQUIRE_DATABASE: "1"
        run: |
          npm run build:hostinger
          test -f .output/server/index.mjs
          node scripts/hostinger-runtime-smoke.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint
