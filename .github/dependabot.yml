version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: hostinger-node-server
    schedule:
      interval: weekly
      day: monday
      time: "05:15"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 5
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    target-branch: hostinger-node-server
    schedule:
      interval: weekly
      day: monday
      time: "05:45"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 5
    labels:
      - dependencies
